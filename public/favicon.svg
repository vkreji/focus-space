<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Wobbly face outline -->
  <path d="M 18 35 Q 25 10 50 12 T 80 20 Q 95 40 93 60 T 80 88 Q 50 95 30 85 T 12 50 Z" stroke="black" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
  
  <!-- Left eye (jagged triangle) -->
  <path d="M 28 28 L 38 48 L 36 35 L 34 35 Z" stroke="black" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
  <path d="M 35 38 L 36 45" stroke="black" stroke-width="1.5" fill="none"/>

  <!-- Right eye (tall oval with scribble) -->
  <ellipse cx="53" cy="35" rx="4" ry="16" stroke="black" stroke-width="1.5" fill="none" transform="rotate(-5 55 35)"/>
  <ellipse cx="53" cy="35" rx="2" ry="8" stroke="black" stroke-width="1.5" fill="none" transform="rotate(5 55 35)"/>
  <path d="M 57 18 L 57 48" stroke="black" stroke-width="1.5" fill="none"/>

  <!-- Wobbly smile -->
  <path d="M 24 62 C 30 75, 45 80, 65 75 C 75 70, 75 60, 75 58 L 74 65" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
